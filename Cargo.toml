[package]
name = "subsink"
version = "0.1.2"
edition = "2021"
description = "A minimalist TUI tool to download & auto-sync Japanese subtitles for raw anime immersion"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inquire = "0.7"
indicatif = "0.17"
console = "0.15"
owo-colors = "4.0"
regex = "1.10"
anyhow = "1.0"
walkdir = "2.5"
zip = "2.1"
tempfile = "3.10"
dirs = "5.0"
urlencoding = "2.1"
html-escape = "0.2"
fuzzy-matcher = "0.3.7"
alass-core = "2.0.0"
alass-util = "0.3.0"
